<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: warm cream paper -->
  <rect width="32" height="32" rx="8" fill="#fbf6ec"/>
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#9b2226" stroke-width="0.6" opacity="0.4"/>

  <!-- Blue T -->
  <!-- Crossbar left arm -->
  <path d="M5 9.5 C6 8.8 8 8.2 10 8 L14.5 8" stroke="#4a6fa5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Crossbar right arm -->
  <path d="M14.5 8 L22 8" stroke="#4a6fa5" stroke-width="2" stroke-linecap="square" fill="none"/>
  <!-- Curl at top-right -->
  <path d="M22 8 C24 8 26.5 7 27.5 5 C28.5 3 27.5 1.5 26 1.5 C24.5 1.5 23.5 2.8 24 4 C24.5 5 25.5 5.2 26 4.5" stroke="#4a6fa5" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- T vertical stem -->
  <path d="M14.5 8 L14.5 28" stroke="#4a6fa5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- T base serifs -->
  <path d="M11.5 28 L17.5 28" stroke="#4a6fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M12.5 30 L16.5 30" stroke="#4a6fa5" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Red R -->
  <!-- R stem -->
  <path d="M9 11 L9 27" stroke="#9b2226" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- R bowl -->
  <path d="M9 11 C9 11 11 10.2 14 10.2 C18 10.2 21 12.2 21 15.8 C21 19.4 18 21.2 14 21.2 L9 21.2" stroke="#9b2226" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- R leg sweep -->
  <path d="M14 21.2 C17 21.2 20 24 22 27 C23 28.5 24.5 30 26 31" stroke="#9b2226" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
